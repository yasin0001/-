<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>YASIN // MATRIX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#00ff55;font-family:monospace}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse,rgba(0,40,12,.35),transparent 65%)}
h1{font-size:clamp(34px,8vw,76px);text-shadow:0 0 12px #00ff55,0 0 35px #00ff55;animation:pulse 1.8s infinite alternate}
p{font-size:clamp(17px,4vw,24px);color:#c5ffd5;text-shadow:0 0 12px #00ff55}
small{margin-top:35px;letter-spacing:4px;color:#00ff55}
@keyframes pulse{to{opacity:.72;filter:brightness(1.5)}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main>
<h1>سلام، من یاسینم!</h1>
<p>به دنیای من خوش اومدی 💚</p>
<small>SYSTEM ONLINE // YASIN</small>
</main>
<script>
const c=document.getElementById('rain'),x=c.getContext('2d');
let w,h,fs=17,drops=[];
function fit(){w=c.width=innerWidth;h=c.height=innerHeight;drops=Array(Math.ceil(w/fs)).fill(1)}
onresize=fit;fit();
function draw(){
 x.fillStyle='rgba(0,0,0,.075)';x.fillRect(0,0,w,h);
 x.font=fs+'px monospace';x.fillStyle='#00ff41';
 for(let i=0;i<drops.length;i++){
  x.fillText(Math.random()>.5?'1':'0',i*fs,drops[i]*fs);
  if(drops[i]*fs>h&&Math.random()>.975)drops[i]=0;
  drops[i]++;
 }
}
setInterval(draw,35);
</script>
</body>
</html>
